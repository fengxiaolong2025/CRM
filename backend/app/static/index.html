<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>公司CRM系统</title>
  <link rel="stylesheet" href="/assets/vendor/element-plus.css" />
  <script src="/assets/vendor/vue.global.prod.js"></script>
  <script src="/assets/vendor/element-plus.full.min.js"></script>

  <style>
    :root{
      --brand:#C00000; --brand-d:#9e1b1b; --brand-l:#fdeaea;
      --side:#1f2430; --side-d:#171b25; --ink:#1f2733; --muted:#8a93a3;
      --bg:#f4f6fa; --card:#ffffff; --line:#eef0f4;
      --shadow:0 6px 22px rgba(31,39,51,.08); --shadow-h:0 12px 30px rgba(31,39,51,.14);
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:"Microsoft YaHei","PingFang SC",-apple-system,sans-serif;background:var(--bg);color:var(--ink)}
    [v-cloak]{display:none}

    /* 登录 */
    .login{height:100vh;display:flex}
    .login-left{flex:1;position:relative;overflow:hidden;
      background:linear-gradient(135deg,#bd5e5e 0%,#a44747 52%,#833838 100%);color:#fff;
      display:flex;flex-direction:column;justify-content:center;padding:0 8%}
    .login-left::after{content:"";position:absolute;right:-120px;bottom:-120px;width:380px;height:380px;background:rgba(255,255,255,.08);border-radius:50%}
    .login-left::before{content:"";position:absolute;left:-80px;top:-80px;width:260px;height:260px;background:rgba(255,255,255,.06);border-radius:50%}
    .brand-logo{width:64px;height:64px;border-radius:16px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;backdrop-filter:blur(4px);margin-bottom:26px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
    .brand-name{font-size:30px;font-weight:800;letter-spacing:2px;margin-bottom:10px}
    .brand-slogan{font-size:15px;opacity:.92;margin-bottom:38px;font-weight:300}
    .brand-feats{list-style:none;position:relative;z-index:1}
    .brand-feats li{display:flex;align-items:center;gap:12px;margin:16px 0;font-size:15px;opacity:.95}
    .brand-feats i{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:14px;font-style:normal}
    .login-right{flex:1;display:flex;align-items:center;justify-content:center;background:var(--bg)}
    .login-box{width:380px;background:#fff;border-radius:18px;padding:44px 40px;box-shadow:var(--shadow-h)}
    .login-box h2{font-size:24px;font-weight:800;color:var(--ink)}
    .login-tip{color:var(--muted);font-size:13px;margin:8px 0 28px}
    .login-btn{width:100%;height:46px;font-size:16px;font-weight:700;border:none;border-radius:10px;background:linear-gradient(90deg,#C00000,#e23b3b);box-shadow:0 8px 18px rgba(192,0,0,.28);letter-spacing:4px}
    .login-foot{margin-top:22px;text-align:center;color:#b6bcc7;font-size:12px}
    .login-field{margin-bottom:18px}

    /* 页面标题（与其它页面 card-title 协调） */
    .page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
    .ph-title{font-size:17px;font-weight:700;color:var(--ink);letter-spacing:.5px}

    /* 产品分类：自研可折叠树 */
    .cat-tree{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);
      font-family:"Helvetica Neue",Helvetica,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","微软雅黑",Arial,sans-serif;font-size:13px;color:var(--ink)}
    .cat-head{display:flex;align-items:center;padding:10px 14px;background:#fafbfc;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);font-weight:600}
    .cat-th-meta{width:150px;text-align:center;flex:none}
    .cat-th-ops{width:140px;text-align:center;flex:none}
    .cat-node .cat-row{display:flex;align-items:center;padding:9px 14px;border-bottom:1px solid #f3f4f7;transition:background .12s}
    .cat-node .cat-row:hover{background:#f7f9fc}
    .cat-node .cat-row-odd{background:#fcfdff}
    .cat-caret{width:18px;color:var(--muted);cursor:pointer;user-select:none;font-size:12px;text-align:center}
    .cat-caret:hover{color:var(--brand)}
    .cat-name{cursor:default;transition:color .15s}
    .cat-name.clickable{cursor:pointer;font-weight:600}
    .cat-name.clickable:hover{color:var(--brand);text-decoration:underline}
    .cat-tag{margin-left:8px}
    .cat-meta{margin-left:14px;color:var(--muted);font-size:12px;flex:none;width:150px;text-align:center}
    .cat-note{margin-left:14px;color:var(--muted);font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .cat-ops{width:140px;flex:none;text-align:right}
    .cat-empty{padding:30px;text-align:center;color:var(--muted)}
    .login-field .el-input{width:100%}
    .login-field:last-of-type{margin-bottom:24px}

    /* 框架 */
    .app-shell{height:100vh}
    .aside{background:linear-gradient(180deg,var(--side),var(--side-d));display:flex;flex-direction:column;overflow:hidden}
    .aside-brand{height:64px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid rgba(255,255,255,.06)}
    .aside-logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#e23b3b,#C00000);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;box-shadow:0 4px 12px rgba(192,0,0,.4)}
    .aside-title{color:#fff;font-weight:700;font-size:16px;letter-spacing:1px}
    .aside-sub{color:rgba(255,255,255,.45);font-size:11px;margin-top:2px}
    .aside-nav{overflow-y:auto;flex:1;padding:10px 0}
    .aside-nav::-webkit-scrollbar{width:6px}
    .aside-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
    .nav-group{margin:6px 12px 2px;color:rgba(255,255,255,.4);font-size:11px;letter-spacing:1px;padding:8px 6px 4px;font-weight:600;display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;transition:color .15s}
    .nav-group:hover{color:rgba(255,255,255,.72)}
    .ng-caret{font-size:10px;width:10px;text-align:center;display:inline-block;color:rgba(255,255,255,.5);transition:transform .18s}
    .ng-caret.ng-collapsed{transform:rotate(-90deg)}
    .nav-item{display:flex;align-items:center;gap:10px;margin:3px 12px;padding:9px 12px;border-radius:9px;color:#c5cad6;cursor:pointer;font-size:14px;transition:all .15s}

    .nav-item .ni{font-size:15px;opacity:.9;width:18px;text-align:center}
    .aside-foot{margin-top:auto;padding:14px 20px;color:rgba(255,255,255,.4);font-size:11px;border-top:1px solid rgba(255,255,255,.06)}

    .topbar{height:60px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;box-shadow:0 2px 10px rgba(31,39,51,.06);position:relative;z-index:5}
    .crumb{display:flex;align-items:center;gap:8px;font-size:15px}
    .crumb .c-root{color:var(--muted)}
    .crumb .c-sep{color:#d4d9e1}
    .crumb .c-cur{color:var(--ink);font-weight:700}
    .top-right{display:flex;align-items:center;gap:16px}
    .search-box{position:relative}
    .search-input{width:260px}
    .search-drop{position:absolute;top:42px;left:0;width:380px;background:#fff;border-radius:10px;box-shadow:var(--shadow-h);z-index:30;max-height:420px;overflow:auto;padding:6px}
    .search-grp-title{font-size:12px;color:var(--muted);padding:8px 12px 4px;font-weight:600}
    .search-item{padding:8px 12px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
    .search-item:hover{background:var(--brand-l)}
    .search-item .si-desc{color:var(--muted);font-size:12px}
    .bell{font-size:20px;color:#5b6472;cursor:pointer;position:relative}
    .avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#e23b3b,#C00000);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;box-shadow:0 3px 8px rgba(192,0,0,.3);cursor:pointer}
    .main{padding:18px;overflow:auto;background:var(--bg);height:calc(100vh - 60px)}

    /* 卡片/通用 */
    .card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:18px}
    .card-title{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
    .card-title .ct-sub{font-size:12px;color:var(--muted);font-weight:400}
    .kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
    .kpi{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;position:relative;overflow:hidden}
    .kpi .k-label{font-size:13px;color:var(--muted);margin-bottom:8px}
    .kpi .k-val{font-size:24px;font-weight:800;color:var(--ink);line-height:1.1}
    .kpi .k-unit{font-size:13px;color:var(--muted);font-weight:600;margin-left:3px}
    .kpi .k-growth{font-size:12px;margin-top:8px;display:inline-flex;align-items:center;gap:4px}
    .kpi .k-ic{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:10px;background:var(--brand-l);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:18px}
    .up{color:#2ba471}.down{color:#e0532f}
    .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
    .toolbar .spacer{flex:1}
    .sec-title{font-size:16px;font-weight:700;margin:6px 0 14px;display:flex;align-items:center;gap:8px}
    .sec-title::before{content:"";width:4px;height:16px;background:var(--brand);border-radius:2px;display:inline-block}
    .chart{width:100%}
    .tag-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
    .empty{color:var(--muted);text-align:center;padding:40px;font-size:14px}
    .scope-bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
    .link{color:var(--brand);cursor:pointer}
    .drawer-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:10px 0 18px}
    .ds{background:var(--bg);border-radius:10px;padding:12px;text-align:center}
    .ds .v{font-size:18px;font-weight:800;color:var(--brand)}
    .ds .l{font-size:12px;color:var(--muted);margin-top:4px}
    .timeline-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
    .tl-dot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none}
    .tl-body .tl-t{font-weight:600;font-size:13px}
    .tl-body .tl-c{color:var(--muted);font-size:12px;margin-top:2px}
    .tl-body .tl-time{color:#b6bcc7;font-size:11px;margin-top:2px}
    .kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px}
    .kb-col{background:var(--bg);border-radius:12px;min-width:240px;flex:1;padding:12px}
    .kb-col-h{font-weight:700;font-size:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
    .kb-card{background:#fff;border-radius:10px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(31,39,51,.06);cursor:pointer}
    .kb-card:hover{box-shadow:0 4px 14px rgba(31,39,51,.12)}
    .kb-amt{color:var(--brand);font-weight:700;margin-top:6px}
  </style>
</head>
<body>
  <div id="app" v-cloak></div>

  <script>
  const { createApp, reactive, ref, computed, onMounted, watch, nextTick } = Vue;
  const ElMessage = ElementPlus.ElMessage;
  const ElMessageBox = ElementPlus.ElMessageBox;

  /* ============================ 全局状态 & 请求 ============================ */
  const TOKEN_KEY = 'crm_token';
  const store = reactive({
    token: localStorage.getItem(TOKEN_KEY) || '',
    user: null,
    opts: { customers:[], products:[], users:[], regions:[], channels:[], levels:[], categories:[], dicts:{}, orders:[] },
    notifications: [],
    unread: 0,
    ui: { pendingCreate: null }
  });
  function setToken(t){ store.token = t; if(t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); }
  function authHeader(){ return store.token ? { Authorization: 'Bearer ' + store.token } : {}; }

  async function api(path, { method='GET', body, params } = {}) {
    let url = '/api' + path;
    if (params) {
      const qs = new URLSearchParams();
      for (const k in params) { const v = params[k]; if (v !== undefined && v !== null && v !== '') qs.set(k, v); }
      const s = qs.toString(); if (s) url += '?' + s;
    }
    const opt = { method, headers: { 'Content-Type':'application/json', ...authHeader() } };
    if (body !== undefined) opt.body = JSON.stringify(body);
    let res = await fetch(url, opt);
    if (res.status === 401) { setToken(''); store.user = null; throw new Error('登录已过期，请重新登录'); }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || ('请求失败(' + res.status + ')'));
    return data;
  }

  function fmtMoney(v){ const n = Number(v||0); return '¥' + n.toLocaleString('zh-CN',{minimumFractionDigits:0,maximumFractionDigits:2}); }
  function fmtNum(v){ const n = Number(v||0); return n.toLocaleString('zh-CN'); }
  function fmtDateTime(v){ if(!v) return ''; return String(v).replace('T',' ').slice(0,19); }
  function tagType(v){ const m={ '待跟进':'info','跟进中':'warning','有效':'success','无效':'info','草稿':'info','待审批':'warning','已通过':'success','已驳回':'danger','待确认':'warning','待发货':'warning','已发货':'primary','已完成':'success','已取消':'info','执行中':'success','待签署':'warning','已到期':'danger','已终止':'info','新建':'info','处理中':'warning','待回访':'warning','已结案':'success','高':'danger','中':'warning','低':'success','待核算':'info','待审批':'warning','已批准':'success','已兑换':'success','已寄出':'primary','已签收':'success','已开票':'success','已作废':'info','在售':'success','停售':'info' }; return m[v]||'info'; }
  function rateColor(v){ const n = Number(v||0); return n>=100?'#2ba471':(n>=80?'#C00000':'#e0532f'); }

  /* ============================ 模块元配置（驱动通用 CRUD） ============================ */
  const CUSTOMER_TYPES = [ {value:'dealer',label:'经销商'}, {value:'restaurant',label:'餐饮门店'}, {value:'supermarket',label:'商超'}, {value:'group',label:'企业团购'} ];

  const COMPLAINT_STATUS = ['新建','处理中','待回访','已结案'];
  const REBATE_STATUS = ['待核算','待审批','已批准','已兑换'];

  function sel(arr){ return arr; } // 透传

  const MODULES = {
    'leads': {
      label:'线索管理', icon:'🎯', group:'销售过程', api:{list:'/leads',create:'/leads',update:'/leads',del:'/leads',pk:'id'},
      columns:[
        {key:'customer_name',label:'客户名称',minWidth:140},
        {key:'contact',label:'联系人',width:90},

      form:{ fields:[
        {key:'customer_name',label:'客户名称',required:true},
        {key:'contact',label:'联系人'},
        {key:'phone',label:'电话'},
        {key:'wechat',label:'微信'},
        {key:'region_id',label:'区域',type:'select',options:'regions'},
        {key:'source',label:'来源',type:'select',options:'dict:lead_source'},

        {key:'score',label:'评分',type:'number'},

      ]},

  const CrudView = {
    props:{ mod:String },
    data(){ return { rows:[], loading:false, query:{ q:'' }, dialogVisible:false, editing:null, form:{}, formLoading:false,
      itemRows:[], actionDialog:false, actionDef:null, actionRow:null, actionForm:{}, actionLoading:false, page:1, total:0 }; },
    computed:{
      m(){ return MODULES[this.mod]; },
      cols(){ return this.m.columns; },

    methods:{
      async load(){
        this.loading=true;
        try{
          const params = Object.assign({}, this.m.listParams||{}, this.query);
          if(this.m.api.list) this.rows = await api(this.m.api.list, { params });
        }catch(e){ ElMessage.error(e.message); } finally{ this.loading=false; }
      },
      resolveOptions(opt){
        if(!opt) return [];
        if(Array.isArray(opt)) return opt.map(x=> typeof x==='string'?{value:x,label:x}:x);
        if(typeof opt==='string'){
          if(opt.startsWith('dict:')){ const k=opt.slice(5); return (store.opts.dicts[k]||[]).map(v=>({value:v,label:v})); }
          const arr = store.opts[opt]||[];
          if(opt==='oppOptions'){ return arr.map(x=>({value:x.id,label:x.name})); }
          if(opt==='leadOptions'){ return arr.map(x=>({value:x.id,label:x.customer_name})); }
          if(opt==='quoteOptions'||opt==='orderOptions'||opt==='policyOptions'){ return arr.map(x=>({value:x.id,label:x.order_no||x.quote_no||x.name||x.no||('#'+x.id)})); }
          return arr.map(x=>({value:x.id, label: x.name||x.code||x.title||x.order_no||x.quote_no||('#'+x.id)}));
        }
        return [];
      },
      defaultForm(){
        const f={}; (this.m.form?this.m.form.fields:[]).forEach(fd=>{ f[fd.key] = (fd.type==='switch')?(fd.default||false):(fd.type==='number'?null:''); });
        if(this.m.form&&this.m.form.items) this.itemRows=[];
        return f;
      },
      openCreate(){ this.editing=null; this.form=this.defaultForm(); if(this.m.form&&this.m.form.items) this.itemRows=[]; this.dialogVisible=true; },
      openEdit(row){ this.editing=row; const f=this.defaultForm();
        (this.m.form?this.m.form.fields:[]).forEach(fd=>{ f[fd.key] = row[fd.key]!==undefined?row[fd.key]:f[fd.key]; });
        this.form=f;
        if(this.m.form&&this.m.form.items){ this.itemRows = (row.items||[]).map(it=>{ const o={}; this.m.form.items.fields.forEach(iff=>o[iff.key]=it[iff.key]); return o; }); }
        this.dialogVisible=true;
      },
      async save(){
        // 校验
        for(const fd of (this.m.form?this.m.form.fields:[])){
          if(fd.required && (this.form[fd.key]===''||this.form[fd.key]===null||this.form[fd.key]===undefined)){ ElMessage.warning('请填写'+fd.label); return; }
        }
        this.formLoading=true;
        try{
          let body = Object.assign({}, this.form);
          if(this.m.form&&this.m.form.items){ body.items = this.itemRows.map(r=>{ const o={}; this.m.form.items.fields.forEach(iff=>o[iff.key]=r[iff.key]); return o; }); }
          let res;
          if(this.editing){ res = await api('/'+this.mod+'/'+this.editing[this.m.api.pk], { method:'PUT', body }); }
          else { res = await api('/'+this.mod, { method:'POST', body }); }
          ElMessage.success('保存成功'); this.dialogVisible=false; this.load();
        }catch(e){ ElMessage.error(e.message); } finally{ this.formLoading=false; }
      },
      async remove(row){
        try{ await ElMessageBox.confirm('确认删除该记录？','提示',{type:'warning'}); }catch(e){ return; }
        try{ await api('/'+this.mod+'/'+row[this.m.api.pk], { method:'DELETE' }); ElMessage.success('已删除'); this.load(); }catch(e){ ElMessage.error(e.message); }
      },
      visibleRowActions(row){ return (this.m.rowActions||[]).filter(a=> !a.need || a.need(row)); },
      runRowAction(a,row){
        if(a.dialog){ this.actionDef=a; this.actionRow=row; this.actionForm={}; (a.dialog.fields||[]).forEach(f=>this.actionForm[f.key]=''); this.actionDialog=true; return; }
        this.doAction(a,row,{});
      },
      async doAction(a,row,extra){
        if(a.confirm){ try{ await ElMessageBox.confirm(a.confirm,'提示',{type:'warning'}); }catch(e){ return; } }
        try{ await api(a.url(row), { method:a.method||'POST', body: a.body?Object.assign({},extra):undefined }); ElMessage.success('操作成功'); this.load(); }catch(e){ ElMessage.error(e.message); }
      },
      async submitAction(){
        this.actionLoading=true;
        try{ await this.doAction(this.actionDef, this.actionRow, this.actionForm); this.actionDialog=false; }finally{ this.actionLoading=false; }
      },
      addItem(){ const o={}; this.m.form.items.fields.forEach(f=>o[f.key]=(f.type==='number'?null:'')); this.itemRows.push(o); },
      delItem(i){ this.itemRows.splice(i,1); },
      itemTotal(){ const f=this.m.form.items.fields; const qk=f.find(x=>x.key==='qty'), pk=f.find(x=>x.key==='unit_price'); if(!qk||!pk) return 0; return this.itemRows.reduce((s,r)=>s+(Number(r[qk.key]||0)*Number(r[pk.key]||0)),0); },
      fmtMoney, fmtNum
    },

  /* ============================ 产品分类（三级·自研递归树） ============================ */
  // 递归节点组件：点击名称/箭头展开其子级
  const CatNode = {
    name: 'CatNode',
    props: { node: Object, depth: { type: Number, default: 0 }, openIds: { type: Array, default: () => [] } },
    computed:{
      hasChildren(){ return (this.node.children || []).length > 0; },
      isOpen(){ return this.openIds.indexOf(this.node.id) >= 0; }
    },
    methods:{
      levelLabel(l){ return ({1:'一级',2:'二级',3:'三级'}[l]) || ('L'+l); },
      levelType(l){ return ({1:'',2:'warning',3:'danger'}[l]) || 'info'; },
      toggle(){ if(this.hasChildren){ this.$emit('toggle', this.node); } },
      onEdit(){ this.$emit('edit', this.node); },
      onDel(){ this.$emit('del', this.node); }
    },
    template:`
    <div class="cat-node">
      <div class="cat-row" :class="{'cat-row-odd': depth%2===1}" :style="{paddingLeft:(12+depth*26)+'px'}">
        <span class="cat-caret" @click="toggle">{{ hasChildren ? (isOpen ? '▾' : '▸') : '·' }}</span>
        <span class="cat-name" :class="{clickable:hasChildren}" @click="toggle">{{ node.name }}</span>
        <el-tag size="small" :type="levelType(node.level)" effect="plain" class="cat-tag">{{ levelLabel(node.level) }}</el-tag>
        <span class="cat-meta">产品 {{ node.product_count||0 }} · 序 {{ node.sort||0 }}</span>
        <span class="cat-note" v-if="node.note" :title="node.note">{{ node.note }}</span>
        <span class="cat-ops">
          <el-button link type="primary" size="small" @click.stop="onEdit">编辑</el-button>
          <el-button link type="danger" size="small" :disabled="hasChildren" @click.stop="onDel">删除</el-button>
        </span>
      </div>
      <div v-if="isOpen && hasChildren">
        <cat-node v-for="c in node.children" :key="c.id" :node="c" :depth="depth+1" :open-ids="openIds"
          @toggle="$emit('toggle',$event)" @edit="$emit('edit',$event)" @del="$emit('del',$event)"></cat-node>
      </div>
    </div>`
  };

  const CategoryView = {
    data(){ return { rows:[], loading:false, dialog:false, editing:null, openIds:[],
      form:{level1:'',level2:'',level3:'',sort:0,note:''} }; },
    methods:{
      async load(){ this.loading=true; try{ const flat = await api('/product-categories'); this.rows = this.buildTree(flat); }catch(e){ ElMessage.error(e.message); } finally{ this.loading=false; } },
      // 将扁平（含 parent_id）列表转成树
      buildTree(flat){
        const byId = {};
        flat.forEach(r => { byId[r.id] = Object.assign({}, r, { children: [] }); });
        const roots = [];
        flat.forEach(r => {
          const node = byId[r.id];
          if (r.parent_id && byId[r.parent_id]) { byId[r.parent_id].children.push(node); }
          else { roots.push(node); }
        });
        const sortRec = (list) => { list.sort((a,b)=>(a.sort||0)-(b.sort||0)||a.id-b.id); list.forEach(n=>sortRec(n.children||[])); };
        sortRec(roots);
        return roots;
      },
      // 点击名称/箭头：展开或收起该节点的子级
      toggle(row){ const i = this.openIds.indexOf(row.id); if(i>=0){ this.openIds.splice(i,1); } else { this.openIds.push(row.id); } },
      expandAll(){ const ids=[]; const walk=l=>{ l.forEach(n=>{ if((n.children||[]).length){ ids.push(n.id); walk(n.children);} }); }; walk(this.rows); this.openIds = ids; },
      collapseAll(){ this.openIds = []; },
      openCreate(){ this.editing=null; this.form={level1:'',level2:'',level3:'',sort:0,note:''}; this.dialog=true; },
      openEdit(r){ this.editing=r; this.form={level1:r.name,level2:'',level3:'',sort:r.sort||0,note:r.note||''}; this.dialog=true; },
      async refreshOpts(){ try{ const o=await api('/options'); store.opts=Object.assign(store.opts,o); }catch(e){} },
      async save(){
        try{
          if(this.editing){
            await api('/product-categories/'+this.editing.id,{method:'PUT',body:{name:this.form.level1,sort:this.form.sort,note:this.form.note}});
          } else {
            await api('/product-categories/row',{method:'POST',body:{level1:this.form.level1,level2:this.form.level2,level3:this.form.level3,sort:this.form.sort,note:this.form.note}});
          }
          this.dialog=false; await this.load(); await this.refreshOpts(); ElMessage.success('已保存');
        }catch(e){ ElMessage.error(e.message); }
      },
      async del(r){
        try{ await this.$confirm('确认删除该分类？删除后将无法恢复（含子分类需先删除子级）。','提示',{type:'warning'}); }catch(e){ return; }
        try{ await api('/product-categories/'+r.id,{method:'DELETE'}); await this.load(); await this.refreshOpts(); ElMessage.success('已删除'); }catch(e){ ElMessage.error(e.message); }
      }
    },
    mounted(){ this.load(); },
    template:`
    <div>
      <div class="page-head">
        <div class="ph-title">产品分类</div>
        <div>
          <el-button size="small" @click="expandAll">展开全部</el-button>
          <el-button size="small" @click="collapseAll">收起全部</el-button>
          <el-button type="primary" @click="openCreate">＋ 新增分类</el-button>
        </div>
      </div>
      <div class="cat-tree" v-loading="loading">
        <div class="cat-head">
          <span class="cat-th" style="flex:1">分类名称</span>
          <span class="cat-th cat-th-meta">层级</span>
          <span class="cat-th cat-th-meta">产品数 / 排序</span>
          <span class="cat-th cat-th-ops">操作</span>
        </div>
        <cat-node v-for="n in rows" :key="n.id" :node="n" :depth="0" :open-ids="openIds"
          @toggle="toggle" @edit="openEdit" @del="del"></cat-node>
        <div v-if="!loading && rows.length===0" class="cat-empty">暂无分类数据</div>
      </div>

      <el-dialog :title="editing?'编辑分类（修改名称）':'新增产品分类（三级）'" v-model="dialog" width="520px">
        <el-form :model="form" label-width="80px">
          <el-form-item :label="editing?'分类名称':'类目一'" required>
            <el-input v-model="form.level1" :placeholder="editing?'请输入分类名称':'如：火锅蘸料（调料）'"></el-input>
          </el-form-item>
          <template v-if="!editing">
            <el-form-item label="类目二"><el-input v-model="form.level2" placeholder="如：杯装（可空）"></el-input></el-form-item>
            <el-form-item label="类目三"><el-input v-model="form.level3" placeholder="如：99g系列（可空）"></el-input></el-form-item>
          </template>
          <el-form-item label="排序"><el-input v-model.number="form.sort" type="number"></el-input></el-form-item>
          <el-form-item label="备注"><el-input v-model="form.note" type="textarea" :rows="2"></el-input></el-form-item>
        </el-form>
        <template #footer>
          <el-button @click="dialog=false">取消</el-button>
          <el-button type="primary" @click="save">保存</el-button>
        </template>
      </el-dialog>
    </div>`
  };

  /* ============================ 根组件 ============================ */
  const App = {
    components:{ LoginView, Workbench, AnalysisView, CrudView, CustomerView, OppBoard, ApprovalsView, UserCenter, CategoryView },
    data(){ return { store, route:'workbench', searchQ:'', searchDrop:false, searchResult:null, notifVisible:false, quickVisible:false, userVisible:false, navCollapsed:false, openGroups: NAV.map(g=>g.group) }; },
    computed:{
      nav(){ return NAV; },
      crumb(){ const item = ALL_NAV[this.route]; const g = NAV.find(g=>g.items.some(i=>i.key===this.route)); return { group:g?g.group:'', label:item?item.label:'' }; },
      viewComp(){
        if(this.route==='workbench') return 'Workbench';
        if(this.route==='approvals') return 'ApprovalsView';
        if(this.route==='customers') return 'CustomerView';
        if(this.route==='opp-board') return 'OppBoard';
        if(this.route==='user-center') return 'UserCenter';
        if(this.route==='product-categories') return 'CategoryView';
        if(this.route.startsWith('analysis/')) return 'AnalysisView';
        if(MODULES[this.route]) return 'CrudView';
        return 'Workbench';
      },
      viewProps(){
        if(this.route.startsWith('analysis/')) return { atype: this.route.split('/')[1] };
        if(MODULES[this.route]) return { mod: this.route };
        return {};
      },
      routeKey(){ return this.route; }
    },
    methods:{
      go(key){ this.route=key; location.hash = '#/'+key; this.searchDrop=false; this.notifVisible=false; this.quickVisible=false; this.userVisible=false; },
      parseHash(){ const h = location.hash.replace(/^#\//,''); if(h && (ALL_NAV[h] || h==='user-center' || h.startsWith('analysis/'))) this.route=h; },
      async bootstrapShared(){ try{ const o = await api('/options'); store.opts = Object.assign(store.opts, o); }catch(e){} },
      async doSearch(){ if(!this.searchQ){ this.searchDrop=false; return; } try{ const r = await api('/search',{params:{q:this.searchQ}}); this.searchResult=r; this.searchDrop=true; }catch(e){} },
      gotoSearch(group,item){ this.go(group.link); this.searchDrop=false; this.searchQ=''; },
      async loadNotif(){ try{ store.notifications = await api('/notifications'); store.unread = store.notifications.length; }catch(e){} },
      gotoNotif(n){ if(n.link) this.go(n.link); this.notifVisible=false; },
      quickCreate(key){ store.ui.pendingCreate = key; this.quickVisible=false; this.go(key); },
      async       logout(){ try{ setToken(''); store.user=null; location.hash=''; }catch(e){} },
      toggleGroup(name){ const i=this.openGroups.indexOf(name); if(i>=0) this.openGroups.splice(i,1); else this.openGroups.push(name); },
      isOpen(name){ return this.openGroups.indexOf(name)>=0; },
      onHash(){ this.parseHash(); }
    },
    mounted(){
      window.addEventListener('hashchange', this.onHash);
      this.parseHash();
      this.bootstrapShared();
      this.loadNotif();
    },
    template:`
    <div v-if="!store.user"><login-view></login-view></div>
    <el-container v-else class="app-shell">
      <el-aside width="224px" class="aside">
        <div class="aside-brand">
          <div class="aside-logo">🍲</div>
          <div><div class="aside-title">川崎 CRM</div><div class="aside-sub">公司 · 客户管理平台</div></div>
        </div>
        <div class="aside-nav">
          <template v-for="g in nav">
            <div class="nav-group" @click="toggleGroup(g.group)">
              <span class="ng-caret" :class="{'ng-collapsed':!isOpen(g.group)}">▾</span>
              <span>{{ g.group }}</span>
            </div>
            <div v-for="it in g.items" v-show="isOpen(g.group)" :key="it.key" class="nav-item" :class="{active: route===it.key}" @click="go(it.key)">
              <span class="ni">{{ it.icon }}</span><span>{{ it.label }}</span>
            </div>
          </template>
        </div>
        <div class="aside-foot">上海新川崎食品有限公司</div>
      </el-aside>
      <el-container>
        <el-header class="topbar">
          <div class="crumb"><span class="c-root">{{ crumb.group }}</span><span class="c-sep" v-if="crumb.group">/</span><span class="c-cur">{{ crumb.label }}</span></div>
          <div class="top-right">
            <div class="search-box">
              <el-input v-model="searchQ" placeholder="全局搜索 客户/订单/商机..." clearable @input="doSearch" @focus="searchQ&&doSearch()" class="search-input">
                <template #prefix><span>🔍</span></template>
              </el-input>
              <div v-if="searchDrop && searchResult" class="search-drop">
                <template v-for="grp in searchResult.groups">
                  <div class="search-grp-title">{{ grp.type }}</div>
                  <div v-for="item in grp.items" :key="item.id" class="search-item" @click="gotoSearch(grp,item)">
                    <span>{{ item.title }}</span><span class="si-desc">{{ item.desc }}</span>
                  </div>
                </template>
                <div v-if="!searchResult.total" class="empty">无匹配结果</div>
              </div>
            </div>
            <el-badge :value="store.unread" :hidden="!store.unread">
              <span class="bell" @click="notifVisible=!notifVisible">🔔</span>
            </el-badge>
            <el-popover :visible="notifVisible" placement="bottom-end" :width="320" title="消息通知">
              <template #reference><span style="position:absolute"></span></template>
              <div style="max-height:340px;overflow:auto">
                <div v-for="(n,i) in store.notifications" :key="i" class="search-item" @click="gotoNotif(n)">
                  <div><el-tag :type="n.level==='danger'?'danger':(n.level==='warning'?'warning':'info')" size="small">{{ n.title }}</el-tag></div>
                  <div class="si-desc">{{ n.desc }}</div>
                </div>
                <div v-if="!store.notifications.length" class="empty">暂无消息</div>
              </div>
            </el-popover>
            <el-dropdown @command="quickCreate">
              <el-button type="primary" size="small">＋ 快速创建</el-button>
              <template #dropdown><el-dropdown-menu>
                <el-dropdown-item command="customers">新增客户</el-dropdown-item>
                <el-dropdown-item command="leads">新增线索</el-dropdown-item>
                <el-dropdown-item command="opportunities">新增商机</el-dropdown-item>
                <el-dropdown-item command="orders">新增订单</el-dropdown-item>
                <el-dropdown-item command="payments">新增回款</el-dropdown-item>
                <el-dropdown-item command="complaints">新增客诉</el-dropdown-item>
              </el-dropdown-menu></template>
            </el-dropdown>
            <el-dropdown @command="onUserCmd">
              <div class="avatar">{{ (store.user&&store.user.name||'?').slice(0,1) }}</div>
              <template #dropdown><el-dropdown-menu>
                <el-dropdown-item command="center" divided>个人中心</el-dropdown-item>
                <el-dropdown-item command="logout">退出登录</el-dropdown-item>
              </el-dropdown-menu></template>
            </el-dropdown>
          </div>
        </el-header>
        <el-main class="main">
          <component :is="viewComp" v-bind="viewProps" :key="routeKey"></component>
        </el-main>
      </el-container>
    </el-container>`,
    onUserCmd(cmd){ if(cmd==='center') this.go('user-center'); else if(cmd==='logout') this.logout(); }
  };

  async function bootstrap(){ await api('/me').then(u=>{ store.user=u; }).catch(()=>{ store.user=null; setToken(''); }); }

  const application = createApp(App);
  application.use(ElementPlus);
  application.component('EChart', EChart);
  application.component('CatNode', CatNode);
  application.mount('#app');
  </script>
</body>
</html>
